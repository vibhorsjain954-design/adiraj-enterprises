<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Create new invoices - Adiraj Enterprises Wholesale Management">
  <title>Billing - Adiraj Enterprises</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-dark: #152a45;
      --primary-light: #3b82f6;
      --secondary: #2c5282;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --light: #f8fafc;
      --dark: #0f172a;
      --gray: #64748b;
      --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --sidebar-width: 260px;
      --input-border: #cbd5e1;
      --input-focus: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      position: fixed;
      left: 0;
      top: 0;
      padding: 24px 16px;
      color: white;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.15);
    }

    .brand {
      text-align: center;
      padding: 12px 0 28px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 160px; height: auto; margin-bottom: 10px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .brand-name { font-size: 1.1rem; font-weight: 600; color: #fff; }
    .brand-tagline { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-top: 4px; }

    .nav-menu { flex: 1; overflow-y: auto; padding-right: 4px; }
    .nav-menu::-webkit-scrollbar { width: 4px; }
    .nav-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; color: rgba(255,255,255,0.9);
      text-decoration: none; border-radius: 8px; margin: 4px 0;
      transition: all 0.2s ease; font-weight: 500; font-size: 0.95rem;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255,255,255,0.15); color: #fff; transform: translateX(4px);
    }

    .nav-item i { width: 20px; text-align: center; font-size: 1.1rem; }

    /* ===== MAIN CONTENT ===== */
    .content {
      margin-left: var(--sidebar-width); padding: 32px 40px; min-height: 100vh;
    }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap; gap: 16px;
    }

    .page-title {
      font-size: 1.5rem; font-weight: 700; color: var(--primary);
      display: flex; align-items: center; gap: 10px;
    }

    .invoice-meta {
      display: flex; gap: 20px; flex-wrap: wrap; background: white;
      padding: 16px 20px; border-radius: 12px; box-shadow: var(--card-shadow); align-items: center;
    }

    .meta-item { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
    .meta-item label { font-weight: 600; color: var(--gray); min-width: 80px; }
    .meta-item span { font-weight: 600; color: var(--primary); font-family: monospace; font-size: 1.05rem; }

    /* ===== FORM SECTION ===== */
    .form-card {
      background: white; padding: 24px; border-radius: 16px; box-shadow: var(--card-shadow); margin-bottom: 24px;
    }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: var(--dark); }

    select {
      width: 100%; max-width: 400px; padding: 12px 14px; border: 2px solid var(--input-border);
      border-radius: 10px; font-size: 1rem; transition: all 0.2s ease; background: var(--light);
    }
    select:focus { outline: none; border-color: var(--input-focus); background: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

    /* ===== ITEM TABLE ===== */
    .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; margin: 20px 0; }

    table { width: 100%; border-collapse: collapse; background: white; min-width: 900px; }

    thead { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; }
    th { padding: 14px 12px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; white-space: nowrap; }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center; vertical-align: middle; }
    tbody tr:hover { background: #f8fafc; }

    .item-cell { position: relative; min-width: 200px; text-align: left; }
    .item-input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 8px;
      font-size: 0.95rem; transition: border-color 0.2s;
    }
    .item-input:focus { border-color: var(--input-focus); outline: none; }

    .suggestions {
      position: absolute; top: 100%; left: 0; right: 0; background: white;
      border: 1px solid #e2e8f0; border-radius: 8px; max-height: 220px;
      overflow-y: auto; z-index: 100; box-shadow: var(--card-shadow); margin-top: 4px;
      display: none;
    }
    .suggestions.active { display: block; }
    .suggestions div { padding: 10px 14px; cursor: pointer; font-size: 0.95rem; transition: background 0.15s; text-align: left; }
    .suggestions div:hover, .suggestions div.selected { background: var(--primary-light); color: white; }
    .suggestions .item-meta { font-size: 0.8rem; color: var(--gray); margin-top: 2px; }

    .num-input {
      width: 85px; padding: 8px 10px; border: 1px solid var(--input-border);
      border-radius: 6px; text-align: center; font-size: 0.95rem;
    }
    .num-input:focus { border-color: var(--input-focus); outline: none; }
    .pcs-per-box { font-weight: 600; color: var(--primary); min-width: 40px; display: inline-block; }
    .amount-cell { font-weight: 700; color: var(--dark); min-width: 90px; }

    .action-btn {
      padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-delete { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .btn-delete:hover { background: var(--danger); color: white; }

    .btn-add {
      background: var(--success); color: white; border: none; padding: 10px 20px;
      border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex;
      align-items: center; gap: 8px; transition: background 0.2s;
    }
    .btn-add:hover { background: #059669; }

    /* ===== TOTAL & ACTIONS ===== */
    .total-section {
      display: flex; justify-content: flex-end; align-items: center; gap: 24px;
      padding: 20px 0; border-top: 2px solid #e2e8f0; margin-top: 20px; flex-wrap: wrap;
    }
    .grand-total { font-size: 1.8rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .grand-total span { font-size: 1rem; font-weight: 500; color: var(--gray); }

    .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white; border: none; padding: 12px 28px; border-radius: 10px; font-weight: 600;
      font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s; box-shadow: 0 4px 14px rgba(30, 58, 95, 0.25);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30, 58, 95, 0.35); }
    .btn-secondary {
      background: white; color: var(--primary); border: 2px solid var(--primary);
      padding: 12px 28px; border-radius: 10px; font-weight: 600; font-size: 1rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .btn-secondary.print { border-color: var(--success); color: var(--success); }
    .btn-secondary.print:hover { background: var(--success); color: white; }

    #msg {
      padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 500;
      margin: 16px 0; display: none; animation: slideIn 0.3s ease;
    }
    #msg.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; display: block; }
    #msg.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; display: block; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== PRINT ===== */
    #printArea { display: none; font-family: Arial, sans-serif; font-size: 12px; max-width: 148mm; margin: auto; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 10mm; display: block !important; }
      @page { size: A5 portrait; margin: 6mm 8mm 8mm 8mm; }
    }

    /* ===== LOADING ===== */
    .spinner {
      display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .spinner { display: inline-block; }
    .btn-primary.loading { pointer-events: none; opacity: 0.9; }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="brand">
      <img src="assets/logo.png" alt="Adiraj Enterprises" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-name">Adiraj Enterprises</div>
      <div class="brand-tagline">Wholesale Distribution Management</div>
    </div>
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
      <a href="billing.html" class="nav-item active"><i class="fas fa-file-invoice"></i> New Invoice</a>
      <a href="edit_invoice.html" class="nav-item"><i class="fas fa-edit"></i> Edit Invoice</a>
      <a href="stock.html" class="nav-item"><i class="fas fa-boxes"></i> Stock</a>
      <a href="payments.html" class="nav-item"><i class="fas fa-wallet"></i> Payments</a>
      <a href="parties.html" class="nav-item"><i class="fas fa-users"></i> Parties</a>
      <a href="party_rates.html" class="nav-item"><i class="fas fa-tag"></i> Party Rates</a>
      <a href="ledger.html" class="nav-item"><i class="fas fa-book"></i> Ledger</a>
      <a href="history.html" class="nav-item"><i class="fas fa-history"></i> Invoice History</a>

    </nav>
  </aside>

  <main class="content">
    <header class="header">
      <h1 class="page-title"><i class="fas fa-file-invoice-dollar"></i> New Invoice</h1>
      <div class="invoice-meta">
        <div class="meta-item"><label><i class="fas fa-hashtag"></i> Invoice No:</label><span id="invoiceNo">Loading...</span></div>
        <div class="meta-item"><label><i class="fas fa-calendar"></i> Date:</label><span id="displayDate">--/--/----</span></div>
      </div>
    </header>

    <section class="form-card">
      <div class="form-group">
        <label class="form-label" for="partySelect"><i class="fas fa-users"></i> Select Party</label>
        <select id="partySelect" onchange="onPartyChange()">
          <option value="">-- Choose Customer --</option>
        </select>
      </div>

      <div class="table-container">
        <table id="billTable">
          <thead>
            <tr>
              <th style="min-width:220px">Item</th>
              <th>Pcs/Box</th>
              <th>Boxes</th>
              <th>Extra Pcs</th>
              <th>Rate (₹)</th>
              <th>Amount</th>
              <th style="width:70px">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <button class="btn-add" onclick="addRow()"><i class="fas fa-plus"></i> Add Item</button>

      <div class="total-section">
        <div class="grand-total"><span>Total:</span> ₹ <span id="grandTotal">0</span></div>
        <div class="action-buttons">
          <button class="btn-primary" id="saveBtn" onclick="saveInvoice()"><span class="btn-text"><i class="fas fa-save"></i> Save Invoice</span><span class="spinner"></span></button>
          <button class="btn-secondary print" onclick="printInvoice()"><i class="fas fa-print"></i> Print Invoice</button>
        </div>
      </div>
      <p id="msg" role="alert" aria-live="polite"></p>
    </section>

    <div id="printArea"></div>
  </main>

  <script>
    const { createClient } = supabase;
    const client = createClient(
      "https://tcgspigynbhhrlgtfnux.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjZ3NwaWd5bmJoaHJsZ3RmbnV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2OTAwMDksImV4cCI6MjA4NzI2NjAwOX0.s6XnSwWiha7GD000I4xyXRqWtWzK1hsrMVuRpFQNgaU"
    );

    let itemsCache = [];

    /* ===============================
       INIT
    ================================= */
    document.addEventListener("DOMContentLoaded", () => {
      setToday();
      generateInvoice();
      loadParties();
      loadItems();
    });

    function setToday() {
      const d = new Date();
      document.getElementById("displayDate").textContent = 
        `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    async function generateInvoice() {
      try {
        const {data} = await client.from("invoices").select("invoice_no").order("invoice_no", {ascending: false}).limit(1);
        let next = 1;
        if (data?.length) next = parseInt(data[0].invoice_no.replace("AD","")) + 1;
        document.getElementById("invoiceNo").textContent = "AD" + String(next).padStart(2, '0');
      } catch (e) { console.error(e); }
    }

    async function loadParties() {
      const {data} = await client.from("parties").select("*").order("name");
      const sel = document.getElementById("partySelect");
      data?.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.id; opt.textContent = p.name; sel.appendChild(opt);
      });
    }

    async function loadItems() {
      const {data} = await client.from("items").select("*").order("name");
      itemsCache = data || [];
    }

    /* ===============================
       ROW MANAGEMENT
    ================================= */
    function addRow() {
      const tbody = document.querySelector("#billTable tbody");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="item-cell">
          <input class="item-input" placeholder="Search item..." autocomplete="off">
          <div class="suggestions"></div>
        </td>
        <td><span class="pcs-per-box">—</span></td>
        <td><input class="num-input box" type="number" min="0" placeholder="0" oninput="calc()" onkeydown="navKey(event, this)"></td>
        <td><input class="num-input pcs" type="number" min="0" placeholder="0" oninput="calc()" onkeydown="navKey(event, this)"></td>
        <td><input class="num-input rate" type="number" min="0" step="0.01" placeholder="0.00" oninput="calc()" onkeydown="navKey(event, this)"></td>
        <td class="amount-cell">₹ 0</td>
        <td><button class="action-btn btn-delete" onclick="deleteRow(this)"><i class="fas fa-trash"></i></button></td>
      `;
      tbody.appendChild(row);
      setupRowEvents(row);
      row.querySelector(".item-input").focus();
    }

    function deleteRow(btn) {
      if (document.querySelectorAll("#billTable tbody tr").length <= 1) return showMessage("At least one row required", "error");
      btn.closest("tr").remove(); calc();
    }

    /* ===============================
       SEARCH & AUTO-FILL
    ================================= */
    function setupRowEvents(row) {
      const inp = row.querySelector(".item-input");
      const sug = row.querySelector(".suggestions");
      let timer;

      inp.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(() => itemSearch(inp, sug), 150);
      });

      inp.addEventListener("keydown", (e) => handleSearchKey(e, inp, row, sug));
      row.querySelectorAll(".num-input").forEach(n => n.addEventListener("input", calc));
      inp.addEventListener("blur", () => setTimeout(() => sug.classList.remove("active"), 200));
    }

    function itemSearch(inp, sug) {
      const val = inp.value.toLowerCase().trim();
      sug.innerHTML = ""; sug.classList.remove("active");
      if (val.length < 2) return;

      const matches = itemsCache.filter(i => i.name.toLowerCase().includes(val)).slice(0, 10);
      if (!matches.length) return;

      matches.forEach(item => {
        const div = document.createElement("div");
        div.innerHTML = `<strong>${highlight(item.name, val)}</strong>
          <div class="item-meta">📦 ${item.pcs_per_box||1}/box • 💰 ₹${item.rate?.toFixed(2)}</div>`;
        div.onclick = () => selectItem(inp, item, sug);
        sug.appendChild(div);
      });
      sug.classList.add("active");
    }

    async function selectItem(inp, item, sug) {
      const row = inp.closest("tr");
      const partyId = document.getElementById("partySelect").value;

      row.dataset.itemid = item.id;
      row.dataset.pcsbox = item.pcs_per_box || 1;
      row.dataset.itemname = item.name;

      inp.value = item.name;
      row.querySelector(".pcs-per-box").textContent = item.pcs_per_box || 1;
      row.querySelector(".rate").value = item.rate?.toFixed(2) || "0.00";

      if (partyId) await applyPartyRate(row, partyId, item.id);

      sug.classList.remove("active"); sug.innerHTML = "";
      calc(); row.querySelector(".box").focus();
    }

    async function applyPartyRate(row, partyId, itemId) {
      try {
        const { data } = await client.from("party_item_rates")
          .select("special_rate")
          .eq("party_id", partyId)
          .eq("item_id", itemId)
          .maybeSingle();
        
        if (data?.special_rate !== null && data?.special_rate !== undefined) {
          const rateInp = row.querySelector(".rate");
          rateInp.value = parseFloat(data.special_rate).toFixed(2);
          rateInp.style.borderColor = "#f59e0b";
          setTimeout(() => rateInp.style.borderColor = "", 1500);
        }
      } catch(e) { console.warn("Rate fetch failed", e); }
    }

    async function onPartyChange() {
      const partyId = document.getElementById("partySelect").value;
      if (!partyId) return;

      showMessage("🔄 Updating party rates...", "success");
      const rows = document.querySelectorAll("#billTable tbody tr");
      for (let row of rows) {
        if (row.dataset.itemid) await applyPartyRate(row, partyId, row.dataset.itemid);
      }
      calc();
      setTimeout(() => { document.getElementById("msg").textContent=""; document.getElementById("msg").className=""; }, 1500);
    }

    function highlight(text, query) {
      return text.replace(new RegExp(`(${query})`, "gi"), '<mark style="background:#fef08a;padding:0 3px;border-radius:3px">$1</mark>');
    }

    /* ===============================
       KEYBOARD NAV
    ================================= */
    function handleSearchKey(e, inp, row, sug) {
      const items = sug.querySelectorAll("div");
      const sel = sug.querySelector(".selected");
      let idx = Array.from(items).indexOf(sel);

      if (e.key === "ArrowDown") { 
        e.preventDefault(); 
        if(sug.classList.contains("active")) { 
          if(sel) sel.classList.remove("selected"); 
          idx++; 
          const next=items[idx%items.length]; 
          if(next) { next.classList.add("selected"); next.scrollIntoView({block:"nearest"}); }
        }
      }
      else if (e.key === "ArrowUp") { 
        e.preventDefault(); 
        if(sug.classList.contains("active")) { 
          if(sel) sel.classList.remove("selected"); 
          idx--; 
          const next=items[(idx+items.length)%items.length]; 
          if(next) { next.classList.add("selected"); next.scrollIntoView({block:"nearest"}); }
        }
      }
      else if (e.key === "Enter") { 
        e.preventDefault(); 
        if (sel) { sel.click(); } 
        else if (inp.value.trim()) { row.querySelector(".box")?.focus(); }
      }
      else if (e.key === "Escape") { 
        sug.classList.remove("active"); 
        sug.innerHTML=""; 
      }
    }

    function navKey(e, el) {
      if (e.key === "Enter") {
        e.preventDefault();
        const row = el.closest("tr");
        if (el.classList.contains("box")) row?.querySelector(".pcs")?.focus();
        else if (el.classList.contains("pcs")) row?.querySelector(".rate")?.focus();
        else if (el.classList.contains("rate")) addRow();
      }
    }

    /* ===============================
       CALCULATE
    ================================= */
    function calc() {
      let total = 0;
      document.querySelectorAll("#billTable tbody tr").forEach(row => {
        const pcsBox = parseFloat(row.dataset.pcsbox) || 1;
        const box = parseFloat(row.querySelector(".box")?.value) || 0;
        const pcs = parseFloat(row.querySelector(".pcs")?.value) || 0;
        const rate = parseFloat(row.querySelector(".rate")?.value) || 0;
        const amt = Math.round((box * rate) + (pcs * (rate / pcsBox)));
        const amtCell = row.querySelector(".amount-cell");
        if (amtCell) amtCell.textContent = `₹ ${amt.toLocaleString()}`;
        total += amt;
      });
      document.getElementById("grandTotal").textContent = total.toLocaleString();
      return total;
    }

    /* ===============================
       SAVE INVOICE - FIXED VALIDATION
    ================================= */

async function saveInvoice() {
  const partyId = document.getElementById("partySelect").value;
  if (!partyId) return showMessage("⚠️ Please select a party", "error");
  
  const rows = document.querySelectorAll("#billTable tbody tr");
  const hasValidItem = Array.from(rows).some(row => row.dataset.itemid);
  if (!hasValidItem) return showMessage("⚠️ Please add at least one item", "error");

  const btn = document.getElementById("saveBtn");
  btn.classList.add("loading");
  showMessage("🔍 Checking stock availability...", "success");

  try {
    // ✅ STEP 1: CHECK STOCK BEFORE SAVING
    const stockErrors = [];
    const itemsToProcess = [];
    
    for (let row of rows) {
      if (!row.dataset.itemid) continue;
      
      const pcsBox = parseFloat(row.dataset.pcsbox) || 1;
      const box = parseFloat(row.querySelector(".box")?.value) || 0;
      const pcs = parseFloat(row.querySelector(".pcs")?.value) || 0;
      const totalQty = (box * pcsBox) + pcs;
      
      if (totalQty <= 0) continue;
      
      // Check current stock
      const { data: stockData, error: stockCheckErr } = await client
        .from("items")
        .select("stock_pieces, name")
        .eq("id", row.dataset.itemid)
        .single();
      
      if (stockCheckErr) {
        console.error("Stock check error:", stockCheckErr);
        throw new Error(`Failed to check stock for ${row.dataset.itemname}`);
      }
      
      const availableStock = stockData.stock_pieces || 0;
      
      if (totalQty > availableStock) {
        stockErrors.push({
          item: row.dataset.itemname,
          requested: totalQty,
          available: availableStock,
          shortage: totalQty - availableStock
        });
      } else {
        itemsToProcess.push({
          row,
          itemid: row.dataset.itemid,
          pcsBox,
          box,
          pcs,
          totalQty
        });
      }
    }
    
    // ✅ BLOCK if insufficient stock
    if (stockErrors.length > 0) {
      btn.classList.remove("loading");
      let errorMsg = "❌ Insufficient Stock:\n\n";
      stockErrors.forEach(err => {
        errorMsg += `• ${err.item}\n`;
        errorMsg += `  Requested: ${err.requested} pcs\n`;
        errorMsg += `  Available: ${err.available} pcs\n`;
        errorMsg += `  Shortage: ${err.shortage} pcs\n\n`;
      });
      errorMsg += "Please update stock or reduce quantity.";
      return showMessage(errorMsg, "error");
    }
    
    showMessage("✅ Stock available. Creating invoice...", "success");

    // ✅ STEP 2: CREATE INVOICE
    const total = calc();
    const {data: newInv, error: invErr} = await client.from("invoices").insert([{
      invoice_no: document.getElementById("invoiceNo").textContent,
      party_id: partyId, 
      total_amount: total, 
      paid_amount: 0, 
      balance_amount: total,
      date: new Date().toISOString().split("T")[0]
    }]).select().single();
    
    if (invErr || !newInv) {
      console.error("Invoice error:", invErr);
      throw invErr || new Error("Invoice creation failed");
    }

    // ✅ STEP 3: SAVE ITEMS & REDUCE STOCK
    for (let item of itemsToProcess) {
      const rate = parseFloat(item.row.querySelector(".rate")?.value) || 0;
      const itemTotal = Math.round((item.box * rate) + (item.pcs * (rate / item.pcsBox)));
      
      // Insert invoice item
      const {error: itemErr} = await client.from("invoice_items").insert([{
        invoice_id: newInv.id, 
        item_id: item.itemid, 
        box: item.box, 
        pcs: item.pcs, 
        rate, 
        total: itemTotal
      }]);
      
      if (itemErr) {
        console.error("Item error:", itemErr);
        throw new Error(`Failed to save item: ${itemErr.message}`);
      }
      
      // Reduce stock (this should never fail now)
      const { error: stockErr } = await client.rpc("reduce_stock", { 
        itemid: item.itemid, 
        qty: item.totalQty 
      });
      
      if (stockErr) {
        console.error("Stock reduction failed:", stockErr);
        throw new Error(`Stock update failed: ${stockErr.message}`);
      }
    }

    showMessage("✅ Invoice saved successfully!", "success");
    setTimeout(() => { 
      if(confirm("Invoice saved! Create new invoice?")) location.reload(); 
      else window.location.href="history.html"; 
    }, 1000);
    
  } catch (err) {
    console.error("Save error:", err);
    showMessage("❌ Save failed: " + err.message, "error");
    btn.classList.remove("loading");
  }
}

    function showMessage(txt, type) {
      const el = document.getElementById("msg"); 
      if (el) {
        el.textContent = txt; 
        el.className = type;
      }
    }
    
    async function logout() {
