<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Adiraj Enterprises - Wholesale Management System Login">
  <title>Adiraj Enterprises - Login</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-dark: #152a45;
      --primary-light: #3b82f6;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --light: #f8fafc;
      --dark: #0f172a;
      --gray: #64748b;
      --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 16px -5px rgba(0,0,0,0.1);
      --input-border: #cbd5e1;
      --input-focus: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      top: -200px;
      right: -200px;
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      animation: float 25s ease-in-out infinite reverse;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 30px) scale(1.05); }
    }

    /* Login Card */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px 36px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      text-align: center;
      position: relative;
      z-index: 10;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      margin-bottom: 32px;
    }

    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--gray);
      font-weight: 500;
    }

    /* Form Styles */
    .form-group {
      text-align: left;
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--dark);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 2px solid var(--input-border);
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s ease;
      background: var(--light);
    }

    input:focus {
      outline: none;
      border-color: var(--input-focus);
      background: white;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    input:focus + .input-icon,
    input:not(:placeholder-shown) + .input-icon {
      color: var(--primary-light);
    }

    input::placeholder {
      color: #94a3b8;
    }

    /* Password Toggle */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 4px;
      font-size: 1rem;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(30, 58, 95, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .login-btn.loading .btn-text { display: none; }
    .login-btn.loading .spinner { display: inline-block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Messages */
    #msg {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      animation: shake 0.5s ease;
    }

    #msg.error {
      display: block;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    #msg.success {
      display: block;
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Footer Links */
    .login-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: var(--gray);
    }

    .login-footer a {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 500;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    /* Security Badge */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--gray);
    }

    .security-badge i {
      color: var(--success);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
        border-radius: 16px;
      }
      
      .logo { width: 150px; }
      .brand-title { font-size: 1.2rem; }
      
      input {
        padding: 12px 12px 12px 40px;
        font-size: 0.95rem;
      }
    }

    /* Focus visible for accessibility */
    input:focus-visible,
    .login-btn:focus-visible,
    .toggle-password:focus-visible {
      outline: 2px solid var(--primary-light);
      outline-offset: 2px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    
    <div class="brand">
      <img src="assets/logo.png" alt="Adiraj Enterprises" class="logo" onerror="this.style.display='none'">
      <h1 class="brand-title">Adiraj Enterprises</h1>
      <p class="brand-subtitle">Wholesale Management System</p>
    </div>

    <form id="loginForm" onsubmit="return false;">
      
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            placeholder="you@company.com"
            autocomplete="email"
            required
          >
          <i class="fas fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••"
            autocomplete="current-password"
            required
            minlength="6"
          >
          <i class="fas fa-lock input-icon"></i>
          <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
        <span class="spinner"></span>
      </button>

      <p id="msg" role="alert" aria-live="polite"></p>

    </form>

    <div class="security-badge">
      <i class="fas fa-shield-alt"></i>
      <span>Secured with Supabase Authentication</span>
    </div>

    <div class="login-footer">
      <p>© <span id="year"></span> Adiraj Enterprises. All rights reserved.</p>
      <p style="margin-top:8px;">
        Need help? <a href="mailto:support@adirajenterprises.com">Contact Support</a>
      </p>
    </div>

  </div>

  <script>
    const { createClient } = supabase;
    const client = createClient(
      "https://tcgspigynbhhrlgtfnux.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjZ3NwaWd5bmJoaHJsZ3RmbnV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2OTAwMDksImV4cCI6MjA4NzI2NjAwOX0.s6XnSwWiha7GD000I4xyXRqWtWzK1hsrMVuRpFQNgaU"
    );

    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
      }
      passwordInput.focus();
    }

    // Allow Enter key to submit
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });

    // LOGIN HANDLER
    document.getElementById("loginForm").addEventListener("submit", handleLogin);
    document.getElementById("loginBtn").addEventListener("click", handleLogin);

    async function handleLogin(e) {
      if (e) e.preventDefault();
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const loginBtn = document.getElementById("loginBtn");
      const msgEl = document.getElementById("msg");

      // Validation
      if (!email || !password) {
        showMessage("Please enter both email and password", "error");
        return;
      }

      if (!isValidEmail(email)) {
        showMessage("Please enter a valid email address", "error");
        return;
      }

      // Show loading state
      setLoading(true);
      clearMessage();

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error || !data.user) {
          showMessage(error?.message || "Invalid credentials. Please try again.", "error");
          setLoading(false);
          return;
        }

        showMessage("Login successful! Redirecting...", "success");
        
        // Small delay for UX
        setTimeout(() => {
          checkRole(data.user.id);
        }, 800);

      } catch (err) {
        console.error("Login error:", err);
        showMessage("An unexpected error occurred. Please try again.", "error");
        setLoading(false);
      }
    }

    // ROLE CHECK & REDIRECT
    async function checkRole(userId) {
      try {
        const { data, error } = await client
          .from("user_roles")
          .select("role")
          .eq("user_id", userId)
          .maybeSingle(); // Use maybeSingle to handle no results gracefully

        if (error) {
          console.error("Role check error:", error);
          showMessage("Unable to verify access. Please contact admin.", "error");
          setLoading(false);
          return;
        }

        // Redirect based on role
        if (data?.role === "admin") {
          window.location.href = "dashboard.html";
        } else {
          // Fallback for non-admin users or if role not found
          window.location.href = "mobile_billing.html";
        }

      } catch (err) {
        console.error("Role check failed:", err);
        // Default fallback
        window.location.href = "dashboard.html";
      }
    }

    // Helper Functions
    function showMessage(text, type) {
      const msgEl = document.getElementById("msg");
      msgEl.textContent = text;
      msgEl.className = type; // 'error' or 'success'
      msgEl.style.display = 'block';
    }

    function clearMessage() {
      const msgEl = document.getElementById("msg");
      msgEl.textContent = '';
      msgEl.className = '';
      msgEl.style.display = 'none';
    }

    function setLoading(isLoading) {
      const btn = document.getElementById("loginBtn");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      
      if (isLoading) {
        btn.classList.add("loading");
        btn.disabled = true;
        emailInput.disabled = true;
        passwordInput.disabled = true;
      } else {
        btn.classList.remove("loading");
        btn.disabled = false;
        emailInput.disabled = false;
        passwordInput.disabled = false;
        passwordInput.focus();
      }
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Auto-focus email field on load
    window.addEventListener('load', () => {
      document.getElementById('email').focus();
    });

    // Prevent form submission on Enter in email field
    document.getElementById('email').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('password').focus();
      }
    });
  </script>

</body>
</html>
