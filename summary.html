<!DOCTYPE html>
<html>
<head>
<title>Party Ledger - Adiraj Enterprises</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;}
.sidebar{width:250px;height:100vh;background:#0f2027;position:fixed;padding-top:20px;color:white;}
.sidebar a{display:block;padding:15px 25px;color:white;text-decoration:none;}
.sidebar a:hover{background:#1a2a40;}
.content{margin-left:250px;padding:40px;}
select,button{padding:8px;margin:5px;}
button{background:#1a2a40;color:white;border:none;cursor:pointer;}
button:hover{background:#243b55;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
table,th,td{border:1px solid #ccc;padding:8px;text-align:center;}
</style>
</head>

<body>

<div class="sidebar">
  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="billing.html">📄 Billing</a>
  <a href="payments.html">💰 Payments</a>
  <a href="summary.html">📊 Party Ledger</a>
</div>

<div class="content">
  <h2>Party Ledger</h2>

  <label>Select Party:</label>
  <select id="partySelect"></select>
  <button onclick="loadLedger()">View Ledger</button>
  <button onclick="window.print()">Print</button>

  <div id="printHeader" style="display:none; text-align:center; margin:20px 0;">
    <strong>ADIRAJ ENTERPRISES</strong><br>
    RAJ SALES, CHOPDA<br>
    Mob: 8655599968 / 9303102823<br>
    <hr>
  </div>

  <table id="ledgerTable">
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Debit (₹)</th>
      <th>Credit (₹)</th>
      <th>Balance (₹)</th>
    </tr>
  </table>

  <h3>Final Balance: ₹ <span id="finalBalance">0</span></h3>
</div>

<script>
const client = window.supabaseClient;

/* LOAD PARTIES */
async function loadParties() {
  const {data} = await client.from("parties").select("*").order("name");
  const select = document.getElementById("partySelect");
  select.innerHTML = "";
  data.forEach(p => {
    let opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name;
    select.appendChild(opt);
  });
}

/* LOAD LEDGER - FIXED */
async function loadLedger() {
  const partyId = document.getElementById("partySelect").value;
  if (!partyId) return alert("Select a party");

  const {data: invoices} = await client.from("invoices")
    .select("invoice_date, invoice_no, total_amount")
    .eq("party_id", partyId);

  const {data: payments} = await client.from("payments")
    .select("date, payment_method, amount")
    .eq("party_id", partyId);

  let transactions = [];

  // Invoices (Debit)
  invoices.forEach(inv => {
    transactions.push({
      date: inv.invoice_date,
      desc: `Invoice ${inv.invoice_no}`,
      debit: inv.total_amount,
      credit: 0
    });
  });

  // Payments (Credit)
  payments.forEach(pay => {
    transactions.push({
      date: pay.date,
      desc: `Payment (${pay.payment_method})`,
      debit: 0,
      credit: pay.amount
    });
  });

  // Sort by date
  transactions.sort((a, b) => new Date(a.date) - new Date(b.date));

  let balance = 0;
  const table = document.getElementById("ledgerTable");
  table.innerHTML = `<tr><th>Date</th><th>Description</th><th>Debit (₹)</th><th>Credit (₹)</th><th>Balance (₹)</th></tr>`;

  transactions.forEach(t => {
    balance += t.debit - t.credit;

    table.innerHTML += `
      <tr>
        <td>${t.date}</td>
        <td>${t.desc}</td>
        <td>${t.debit || ""}</td>
        <td>${t.credit || ""}</td>
        <td><b>₹${balance}</b></td>
      </tr>`;
  });

  document.getElementById("finalBalance").innerText = balance;
}

/* INIT */
document.addEventListener("DOMContentLoaded", () => {
  loadParties();
});
</script>
</body>
</html>
